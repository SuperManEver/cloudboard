version: 1
backend:
  phases:
    build:
      commands:
        - nvm install
        - nvm use
        - node -v
        # Not `npm ci`: @aws-amplify/data-construct and graphql-api-construct
        # ship bundled @opentelemetry packages that pin core@2.0.0 but bundle
        # core@2.8.0, which `npm ci` reports as an out-of-sync lockfile.
        # `npm install` uses the lockfile as is; the diff check fails the
        # build if it had to change it, so installs stay reproducible.
        - npm install --cache .npm --prefer-offline --no-audit --no-fund
        - git diff --exit-code package-lock.json
        - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
frontend:
  phases:
    build:
      commands:
        - nvm use
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - .next/cache/**/*
      - .npm/**/*
